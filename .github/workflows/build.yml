name: Build and Test

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run tests
      run: swift test --verbose
    
    - name: Build release DDCMenu
      run: xcodebuild -scheme DDCMenu -configuration Release -destination 'generic/platform=macOS' build CODE_SIGNING_ALLOWED=NO

    - name: Package release assets
      run: |
        APP_PATH=$(find . -name "DDCMenu.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "DDCMenu.app not found!"
          exit 1
        fi
        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../../DDCMenu.zip
        
        cd .build/release
        zip -j ../../ddc.zip ddc
    
    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: |
          DDCMenu.zip
          ddc.zip
  
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        name: release-assets
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          DDCMenu.zip
          ddc.zip